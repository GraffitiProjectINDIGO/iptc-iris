name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    name: test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install metadata tools on Ubuntu
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libimage-exiftool-perl exiv2

    - name: Install metadata tools on macOS
      if: runner.os == 'macOS'
      run: |
        brew install exiftool exiv2

    - name: Install metadata tools on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install exiftool -y --no-progress
        $version = "0.28.8"
        $zip = Join-Path $env:RUNNER_TEMP "exiv2.zip"
        $dest = Join-Path $env:RUNNER_TEMP "exiv2"
        $url = "https://github.com/Exiv2/exiv2/releases/download/v$version/exiv2-$version-2022msvc-AMD64.zip"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dest
        $bin = Get-ChildItem -Path $dest -Recurse -Filter exiv2.exe | Select-Object -First 1 -ExpandProperty DirectoryName
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Show metadata tool versions
      run: |
        exiftool -ver
        exiv2 -V

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Run tests
      run: |
        python -m pytest

  lint:
    runs-on: ubuntu-latest
    name: lint and type check
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip

    - name: Install package with development tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[develop]"

    - name: Ruff
      run: |
        python -m ruff check
        python -m ruff format --check

    - name: Pyright
      run: |
        python -m pyright
